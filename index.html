<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        function ReceiptSplitter() {
            const [items, setItems] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(false);
            const [payer, setPayer] = React.useState('Jason');
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [isConfigured, setIsConfigured] = React.useState(!!localStorage.getItem('gemini_api_key'));

            const saveApiKey = (e) => {
                e.preventDefault();
                if (apiKey.trim()) {
                    localStorage.setItem('gemini_api_key', apiKey.trim());
                    setIsConfigured(true);
                }
            };

            const resetApiKey = () => {
                localStorage.removeItem('gemini_api_key');
                setApiKey('');
                setIsConfigured(false);
            };

            const fileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setIsLoading(true);

                try {
                    const base64Image = await fileToBase64(file);
                    
                    const prompt = `
                        Analyse this UK supermarket receipt (it could be Costco, Tesco, Asda, etc.).
                        Extract the purchased items into a JSON array of objects.
                        
                        CRITICAL RULES FOR COSTCO AND DISCOUNTS:
                        - If a discount (e.g., "IRC") appears immediately below an item, subtract that discount from the item's price and output the final net price.
                        - If the receipt indicates an item includes VAT, ensure the price reflects the final cost to the consumer inclusive of that VAT.
                        - Ignore non-product lines like subtotals, tender amounts, change, or card details.
                        
                        Each object must have exactly these keys:
                        - "id": A unique integer starting from 1.
                        - "name": A clean, readable string of the item name.
                        - "price": The final calculated price of the item (number/float).
                        - "selectedBy": Set this exactly to null.
                        
                        Do not include markdown blocks like \`\`\`json. Output ONLY the raw JSON array.
                    `;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: file.type, data: base64Image } }
                                ]
                            }]
                        })
                    });
                    
                    if (!response.ok) throw new Error("API request failed. Check your API key.");
                    
                    const data = await response.json();
                    let rawText = data.candidates[0].content.parts[0].text.trim();
                    
                    if (rawText.startsWith("```json")) rawText = rawText.slice(7, -3);
                    else if (rawText.startsWith("```")) rawText = rawText.slice(3, -3);
                        
                    setItems(JSON.parse(rawText));
                } catch (error) {
                    console.error("Error:", error);
                    alert("Failed to process receipt. Make sure your API key is correct.");
                } finally {
                    setIsLoading(false);
                }
            };

            const setSelection = (id, person) => {
                setItems(items.map(item => 
                    item.id === id ? { ...item, selectedBy: person } : item
                ));
            };

            const jasonTotal = items.reduce((sum, item) => {
                if (item.selectedBy === 'Jason') return sum + item.price;
                if (item.selectedBy === 'Both') return sum + (item.price / 2);
                return sum;
            }, 0);

            const scottTotal = items.reduce((sum, item) => {
                if (item.selectedBy === 'Scott') return sum + item.price;
                if (item.selectedBy === 'Both') return sum + (item.price / 2);
                return sum;
            }, 0);

            const receiptTotal = items.reduce((sum, item) => sum + item.price, 0);
            const assignedTotal = jasonTotal + scottTotal;
            const hasUnassigned = assignedTotal > 0 && assignedTotal < (receiptTotal - 0.05);
            
            let settlementMessage = "Totals are perfectly balanced.";
            if (payer === 'Jason' && scottTotal > 0) {
                settlementMessage = `Scott owes Jason £${scottTotal.toFixed(2)}`;
            } else if (payer === 'Scott' && jasonTotal > 0) {
                settlementMessage = `Jason owes Scott £${jasonTotal.toFixed(2)}`;
            } else if (assignedTotal === 0) {
                settlementMessage = "Assign items to calculate settlement.";
            }

            if (!isConfigured) {
                return (
                    <div className="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-4">
                        <h1 className="text-2xl font-bold text-slate-800">Setup Required</h1>
                        <p className="text-slate-600 text-sm">To run this app in the browser, paste your Gemini API key below. It will be securely saved in your browser's local storage.</p>
                        <form onSubmit={saveApiKey} className="space-y-4 mt-4">
                            <input 
                                type="password" 
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                                placeholder="AIzaSy..."
                                className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500"
                                required
                            />
                            <button type="submit" className="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                Save & Continue
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="text-center relative">
                        <button onClick={resetApiKey} className="absolute right-0 top-0 text-xs text-slate-400 hover:text-slate-600 underline">Reset API Key</button>
                        <h1 className="text-3xl font-bold text-slate-800">Receipt Splitter</h1>
                        <p className="text-slate-500 mt-2">Scan a receipt to auto-fill items and calculate shares.</p>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <label className="block text-sm font-medium text-slate-700 mb-2">Upload Receipt Image</label>
                        <input 
                            type="file" 
                            accept="image/*" 
                            onChange={handleFileUpload}
                            disabled={isLoading}
                            className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                        />
                        {isLoading && (
                            <div className="mt-4 flex items-center text-blue-600">
                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Analysing with Gemini...
                            </div>
                        )}
                    </div>

                    {items.length > 0 && (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 bg-slate-50 border-b border-slate-200 grid grid-cols-12 gap-4 font-semibold text-slate-700 text-sm">
                                <div className="col-span-5">Item</div>
                                <div className="col-span-2 text-right">Price</div>
                                <div className="col-span-5 text-center">Assign To</div>
                            </div>
                            <div className="divide-y divide-slate-100">
                                {items.map((item) => (
                                    <div key={item.id} className="p-4 grid grid-cols-12 gap-4 items-center hover:bg-slate-50 transition-colors">
                                        <div className="col-span-5 text-sm font-medium text-slate-800 break-words">{item.name}</div>
                                        <div className="col-span-2 text-sm text-right font-mono text-slate-600">£{item.price.toFixed(2)}</div>
                                        <div className="col-span-5 flex justify-center space-x-1">
                                            <button onClick={() => setSelection(item.id, 'Jason')} className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors ${item.selectedBy === 'Jason' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Jason</button>
                                            <button onClick={() => setSelection(item.id, 'Both')} className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors ${item.selectedBy === 'Both' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Both</button>
                                            <button onClick={() => setSelection(item.id, 'Scott')} className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors ${item.selectedBy === 'Scott' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Scott</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {items.length > 0 && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                                <h2 className="font-bold text-lg text-slate-800 border-b pb-2">Calculated Shares</h2>
                                <div className="flex justify-between items-center text-blue-700">
                                    <span className="font-medium">Jason's Share:</span>
                                    <span className="font-mono font-bold text-lg">£{jasonTotal.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between items-center text-emerald-700">
                                    <span className="font-medium">Scott's Share:</span>
                                    <span className="font-mono font-bold text-lg">£{scottTotal.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between items-center text-slate-800 pt-2 border-t border-slate-100">
                                    <span className="font-bold">Assigned Total:</span>
                                    <span className="font-mono font-bold text-lg">£{assignedTotal.toFixed(2)}</span>
                                </div>
                                {hasUnassigned && (
                                    <p className="text-xs text-amber-600 mt-1">Note: The assigned total is less than the receipt total. Ensure all items are assigned.</p>
                                )}
                            </div>

                            <div className="bg-slate-800 p-6 rounded-xl shadow-sm space-y-5 text-white">
                                <h2 className="font-bold text-lg border-b border-slate-600 pb-2">Settlement</h2>
                                <div className="space-y-2">
                                    <label className="text-sm font-medium text-slate-300 block mb-2">Who paid at the till?</label>
                                    <div className="flex p-1 bg-slate-700 rounded-lg">
                                        <button onClick={() => setPayer('Jason')} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all duration-200 ${payer === 'Jason' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>Jason Paid</button>
                                        <button onClick={() => setPayer('Scott')} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all duration-200 ${payer === 'Scott' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>Scott Paid</button>
                                    </div>
                                </div>
                                <div className="mt-6 pt-4 border-t border-slate-600">
                                    <div className="text-center font-bold text-xl text-amber-400">{settlementMessage}</div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReceiptSplitter/>);
    </script>
</body>
</html>
