<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Receipt Splitter</title>

    <!-- Home screen web app (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Receipts">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc">
    <link rel="apple-touch-icon" href="Icon.png">
    <link rel="icon" type="image/png" href="Icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Keep content clear of the notch / home indicator when launched from the home screen */
        body {
            padding-top: max(0.75rem, env(safe-area-inset-top));
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            padding-left: max(0.75rem, env(safe-area-inset-left));
            padding-right: max(0.75rem, env(safe-area-inset-right));
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-3 sm:p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        // ---------- Helpers ----------
        const round2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
        const makeId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const fmt = (p) => (p < 0 ? `-£${Math.abs(p).toFixed(2)}` : `£${p.toFixed(2)}`);
        const sumItems = (items) => round2(items.reduce((s, i) => s + i.price, 0));

        const PencilIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
        );
        const XIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
        );

        // Works out whether a mismatch can be pinned on a specific line.
        // Returns null if totals match, otherwise { diff, suspects: { itemId: reason } }.
        const analyseMismatch = (receipt) => {
            const calc = sumItems(receipt.items);
            const diff = round2(calc - receipt.receiptTotal);
            if (Math.abs(diff) <= 0.05) return null;

            const abs = Math.abs(diff);
            const matches = (price) => Math.abs(Math.abs(price) - abs) <= 0.01;
            const suspects = {};

            receipt.items.forEach(item => {
                if (diff > 0 && item.type === 'item' && matches(item.price)) {
                    suspects[item.id] = 'Price equals the difference – possibly duplicated or should be voided';
                } else if (diff < 0 && item.type === 'discount' && matches(item.price)) {
                    suspects[item.id] = 'Discount equals the difference – possibly duplicated or not actually applied';
                }
            });

            // Lines the AI flagged as hard to read
            receipt.items.forEach(item => {
                if (item.uncertain && !suspects[item.id] && !item.edited) {
                    suspects[item.id] = 'AI was unsure about this line – check the price';
                }
            });

            return { diff, suspects };
        };

        function ReceiptSplitter() {
            const [receipts, setReceipts] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(false);
            const [progress, setProgress] = React.useState({ done: 0, total: 0 });
            const [editing, setEditing] = React.useState(null); // { receiptId, itemId|null, isDiscount, value }
            const [copied, setCopied] = React.useState(false);
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [isConfigured, setIsConfigured] = React.useState(!!localStorage.getItem('gemini_api_key'));

            const saveApiKey = (e) => {
                e.preventDefault();
                if (apiKey.trim()) {
                    localStorage.setItem('gemini_api_key', apiKey.trim());
                    setIsConfigured(true);
                }
            };

            const resetApiKey = () => {
                localStorage.removeItem('gemini_api_key');
                setApiKey('');
                setIsConfigured(false);
            };

            const compressImage = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 1600;
                        let { width, height } = img;

                        if (width > height && width > MAX_DIM) {
                            height = Math.round(height * (MAX_DIM / width));
                            width = MAX_DIM;
                        } else if (height >= width && height > MAX_DIM) {
                            width = Math.round(width * (MAX_DIM / height));
                            height = MAX_DIM;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                        resolve(compressedBase64);
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });

            const PROMPT = `
                Analyse this UK supermarket receipt.
                You are a data extractor. DO NOT DO ANY MATHEMATICS. DO NOT SUBTRACT DISCOUNTS. DO NOT REMOVE VOIDS.

                RULES FOR EXTRACTION:
                1. List EVERY product purchased, in the order printed.
                2. "originalPrice": The price printed next to the product (always a positive number).
                3. "discountAmount": If the item is immediately followed by a discount line (e.g. "IRC", "SLICES", or a negative price like "2.00-Z"), record the absolute value of that discount here (e.g. 2.00). If no discount, output 0.
                4. "discountLabel": The text printed on that discount line (e.g. "IRC", "Clubcard Price"). Empty string if no discount.
                5. "isVoided": Look at the VOID section at the bottom. If a product was voided, you must output a JSON object for it, but set "isVoided": true.
                   Example: If they bought 2 Samosas and 1 was voided, output two separate Samosa objects: one with isVoided: false, and one with isVoided: true.
                6. "uncertain": true if the name or price on that line is blurred, cut off or hard to read. Otherwise false.
                7. "otherDiscounts": Any discount or saving line that is NOT directly under a single product but IS subtracted before the final total (e.g. multibuy savings, coupons, basket discounts). Absolute values. Do not repeat discounts already recorded against an item. Empty array if none.

                Return ONLY a JSON object with this exact structure:
                {
                    "store": "Name of the store (e.g., Costco) or 'Unknown Store'",
                    "date": "Date on receipt (e.g., DD/MM/YYYY) or 'Unknown Date'",
                    "receiptTotal": exactly_the_number_printed_as_the_final_total_at_the_bottom,
                    "items": [
                        {
                            "name": "Clean item name",
                            "originalPrice": 7.99,
                            "discountAmount": 2.00,
                            "discountLabel": "IRC",
                            "isVoided": false,
                            "uncertain": false
                        }
                    ],
                    "otherDiscounts": [
                        { "name": "Multibuy saving", "amount": 1.50 }
                    ]
                }

                Do not include markdown blocks like \`\`\`json. Output ONLY the raw JSON object.
            `;

            // Turns the AI output into display lines: products as positive lines, discounts as negative lines.
            const buildItems = (parsed) => {
                const out = [];
                (parsed.items || [])
                    .filter(item => item.isVoided !== true)
                    .forEach(item => {
                        const original = round2(Number(item.originalPrice) || 0);
                        const discount = round2(Math.abs(Number(item.discountAmount) || 0));
                        const name = item.name || 'Unnamed item';
                        const parentId = makeId('item');

                        out.push({ id: parentId, name, price: original, type: 'item', selectedBy: null, uncertain: !!item.uncertain });

                        if (discount > 0) {
                            const label = (item.discountLabel || '').trim();
                            out.push({
                                id: makeId('disc'),
                                name: label ? `${label} – ${name}` : `Discount – ${name}`,
                                price: -discount,
                                type: 'discount',
                                parentId,
                                selectedBy: null,
                                manuallyAssigned: false,
                                uncertain: false
                            });
                        }
                    });

                (parsed.otherDiscounts || []).forEach(d => {
                    const amount = round2(Math.abs(Number(d.amount) || 0));
                    if (amount > 0) {
                        out.push({
                            id: makeId('disc'),
                            name: d.name || 'Discount',
                            price: -amount,
                            type: 'discount',
                            parentId: null,
                            selectedBy: null,
                            manuallyAssigned: true,
                            uncertain: false
                        });
                    }
                });

                return out;
            };

            const processFile = async (file, order) => {
                const base64Image = await compressImage(file);

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: PROMPT },
                                { inlineData: { mimeType: 'image/jpeg', data: base64Image } }
                            ]
                        }],
                        generationConfig: { responseMimeType: 'application/json' }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || 'Unknown API Error');

                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                if (!rawText) throw new Error('Empty response from Gemini');
                if (rawText.startsWith('```json')) rawText = rawText.slice(7, -3);
                else if (rawText.startsWith('```')) rawText = rawText.slice(3, -3);

                const parsed = JSON.parse(rawText);

                return {
                    id: makeId('receipt'),
                    order,
                    fileName: file.name,
                    store: parsed.store && parsed.store !== 'Unknown Store' ? parsed.store : file.name,
                    date: parsed.date || '',
                    receiptTotal: round2(Number(parsed.receiptTotal) || 0),
                    payer: 'Jason',
                    items: buildItems(parsed)
                };
            };

            const handleFileUpload = async (event) => {
                const files = Array.from(event.target.files || []);
                event.target.value = '';
                if (!files.length) return;

                setIsLoading(true);
                setProgress({ done: 0, total: files.length });

                const batchStart = Date.now() * 1000;
                const failures = [];
                const CONCURRENCY = 3; // avoids hitting Gemini rate limits with big batches
                let next = 0;

                const worker = async () => {
                    while (next < files.length) {
                        const idx = next++;
                        const file = files[idx];
                        try {
                            const receipt = await processFile(file, batchStart + idx);
                            setReceipts(prev => [...prev, receipt].sort((a, b) => a.order - b.order));
                        } catch (error) {
                            console.error(`Error processing ${file.name}:`, error);
                            failures.push(`${file.name}: ${error.message}`);
                        } finally {
                            setProgress(p => ({ ...p, done: p.done + 1 }));
                        }
                    }
                };

                await Promise.all(Array.from({ length: Math.min(CONCURRENCY, files.length) }, worker));
                setIsLoading(false);

                if (failures.length) {
                    alert(`${failures.length} of ${files.length} receipt(s) failed:\n\n${failures.join('\n')}`);
                }
            };

            // ---------- Receipt / item mutations ----------
            const updateReceipt = (receiptId, fn) => {
                setReceipts(prev => prev.map(r => (r.id === receiptId ? fn(r) : r)));
            };

            const setSelection = (receiptId, itemId, person) => {
                updateReceipt(receiptId, receipt => {
                    const target = receipt.items.find(i => i.id === itemId);
                    if (!target) return receipt;
                    const newSel = target.selectedBy === person ? null : person; // tap again to unassign

                    return {
                        ...receipt,
                        items: receipt.items.map(item => {
                            if (item.id === itemId) {
                                return {
                                    ...item,
                                    selectedBy: newSel,
                                    manuallyAssigned: item.type === 'discount' ? true : item.manuallyAssigned
                                };
                            }
                            // A linked discount follows its product until you assign the discount yourself
                            if (target.type === 'item' && item.parentId === itemId && !item.manuallyAssigned) {
                                return { ...item, selectedBy: newSel };
                            }
                            return item;
                        })
                    };
                });
            };

            const deleteItem = (receiptId, itemId) => {
                updateReceipt(receiptId, receipt => ({
                    ...receipt,
                    items: receipt.items
                        .filter(i => i.id !== itemId)
                        // Orphaned discounts stay but are unlinked
                        .map(i => (i.parentId === itemId ? { ...i, parentId: null, manuallyAssigned: true } : i))
                }));
            };

            const updatePayer = (receiptId, person) => {
                updateReceipt(receiptId, r => ({ ...r, payer: person }));
            };

            const deleteReceipt = (receiptId) => {
                if (confirm('Remove this receipt?')) {
                    setReceipts(prev => prev.filter(r => r.id !== receiptId));
                }
            };

            // ---------- Inline editing ----------
            const startEdit = (receiptId, itemId, currentValue, isDiscount = false) => {
                setEditing({ receiptId, itemId, isDiscount, value: Math.abs(currentValue).toFixed(2) });
            };

            const commitEdit = () => {
                if (!editing) return;
                const n = parseFloat(editing.value);
                const { receiptId, itemId, isDiscount } = editing;
                setEditing(null);
                if (isNaN(n)) return;

                if (itemId === null) {
                    updateReceipt(receiptId, r => ({ ...r, receiptTotal: round2(n), totalEdited: true }));
                } else {
                    const value = isDiscount ? -Math.abs(round2(n)) : round2(n);
                    updateReceipt(receiptId, r => ({
                        ...r,
                        items: r.items.map(i => (i.id === itemId ? { ...i, price: value, edited: true } : i))
                    }));
                }
            };

            const handleEditKey = (e) => {
                if (e.key === 'Enter') commitEdit();
                if (e.key === 'Escape') setEditing(null);
            };

            const isEditing = (receiptId, itemId) =>
                editing && editing.receiptId === receiptId && editing.itemId === itemId;

            const EditInput = ({ isDiscount }) => (
                <div className="flex items-center">
                    <span className="font-mono font-bold text-slate-600 mr-1">{isDiscount ? '-£' : '£'}</span>
                    <input
                        type="number"
                        step="0.01"
                        inputMode="decimal"
                        autoFocus
                        value={editing.value}
                        onChange={(e) => setEditing({ ...editing, value: e.target.value })}
                        onKeyDown={handleEditKey}
                        onBlur={commitEdit}
                        className="w-20 px-2 py-1 border border-blue-400 rounded font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
                    />
                </div>
            );

            // ---------- Grand totals ----------
            let jasonTotalShare = 0;
            let scottTotalShare = 0;
            let jasonTotalPaid = 0;
            let scottTotalPaid = 0;
            let assignedCount = 0;
            let unassignedCount = 0;

            receipts.forEach(receipt => {
                const receiptTotal = sumItems(receipt.items);
                receipt.items.forEach(item => {
                    if (item.selectedBy === 'Jason') { jasonTotalShare += item.price; assignedCount++; }
                    else if (item.selectedBy === 'Scott') { scottTotalShare += item.price; assignedCount++; }
                    else if (item.selectedBy === 'Both') {
                        jasonTotalShare += item.price / 2;
                        scottTotalShare += item.price / 2;
                        assignedCount++;
                    } else {
                        unassignedCount++;
                    }
                });

                if (receipt.payer === 'Jason') jasonTotalPaid += receiptTotal;
                if (receipt.payer === 'Scott') scottTotalPaid += receiptTotal;
            });

            const hasUnassigned = assignedCount > 0 && unassignedCount > 0;
            const jasonBalance = jasonTotalPaid - jasonTotalShare;
            const scottBalance = scottTotalPaid - scottTotalShare;

            let settlementMessage = 'Totals are perfectly balanced.';
            if (receipts.length === 0) {
                settlementMessage = 'No receipts scanned yet.';
            } else if (assignedCount === 0) {
                settlementMessage = 'Assign items to calculate settlement.';
            } else if (jasonBalance > 0.01) {
                settlementMessage = `Scott owes Jason £${jasonBalance.toFixed(2)}`;
            } else if (scottBalance > 0.01) {
                settlementMessage = `Jason owes Scott £${scottBalance.toFixed(2)}`;
            }

            // ---------- Report ----------
            const buildReport = () => {
                const DIVIDER = '━━━━━━━━━━━━━━━━━━━━';
                const lines = [];
                const now = new Date().toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });

                lines.push('RECEIPT SPLIT REPORT');
                lines.push(`Generated ${now}`);
                lines.push('');
                lines.push(`>> ${settlementMessage.toUpperCase()}`);
                lines.push('');
                lines.push('SUMMARY');
                lines.push(`Jason – paid ${fmt(round2(jasonTotalPaid))}, share ${fmt(round2(jasonTotalShare))}`);
                lines.push(`Scott – paid ${fmt(round2(scottTotalPaid))}, share ${fmt(round2(scottTotalShare))}`);
                lines.push(`Receipts: ${receipts.length}`);

                const warnings = [];
                if (unassignedCount > 0) warnings.push(`${unassignedCount} line${unassignedCount > 1 ? 's' : ''} not assigned (excluded from shares)`);
                receipts.forEach(r => {
                    const m = analyseMismatch(r);
                    if (m) warnings.push(`${r.store}: calculated total is £${Math.abs(m.diff).toFixed(2)} ${m.diff > 0 ? 'higher' : 'lower'} than the receipt`);
                });
                if (warnings.length) {
                    lines.push('');
                    lines.push('WARNINGS');
                    warnings.forEach(w => lines.push(`⚠ ${w}`));
                }

                const groups = [
                    { key: 'Jason', label: 'JASON' },
                    { key: 'Scott', label: 'SCOTT' },
                    { key: 'Both', label: 'SHARED (50/50)' },
                    { key: null, label: 'UNASSIGNED' }
                ];

                receipts.forEach(r => {
                    const calc = sumItems(r.items);
                    const m = analyseMismatch(r);
                    const dateStr = r.date && r.date !== 'Unknown Date' ? ` – ${r.date}` : '';

                    lines.push('');
                    lines.push(DIVIDER);
                    lines.push(`${r.store.toUpperCase()}${dateStr}`);
                    lines.push(`Paid by ${r.payer}`);
                    lines.push(`Receipt total ${fmt(r.receiptTotal)} | Calculated ${fmt(calc)}${m ? ' | MISMATCH' : ''}`);

                    groups.forEach(g => {
                        const items = r.items.filter(i => (i.selectedBy || null) === g.key);
                        if (!items.length) return;
                        const subtotal = sumItems(items);
                        const subtotalText = g.key === 'Both'
                            ? `${fmt(subtotal)} total, ${fmt(round2(subtotal / 2))} each`
                            : fmt(subtotal);

                        lines.push('');
                        lines.push(`${g.label} – ${subtotalText}`);
                        items.forEach(i => {
                            const tag = i.edited ? ' (edited)' : '';
                            lines.push(`  • ${i.name} – ${fmt(i.price)}${tag}`);
                        });
                    });
                });

                lines.push('');
                lines.push(DIVIDER);
                lines.push(`>> ${settlementMessage}`);
                return lines.join('\n');
            };

            const shareReport = async () => {
                const text = buildReport();
                const subject = `Receipt split – ${new Date().toLocaleDateString('en-GB')}`;

                if (navigator.share) {
                    try {
                        await navigator.share({ title: subject, text });
                        return;
                    } catch (e) {
                        if (e.name === 'AbortError') return; // user closed the share sheet
                    }
                }
                // Fallback: open the default mail app
                window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
            };

            const copyReport = async () => {
                try {
                    await navigator.clipboard.writeText(buildReport());
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch {
                    alert('Could not copy to clipboard.');
                }
            };

            if (!isConfigured) {
                return (
                    <div className="max-w-md mx-auto mt-10 md:mt-20 bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-4">
                        <h1 className="text-2xl font-bold text-slate-800">Setup Required</h1>
                        <p className="text-slate-600 text-sm">To run this app in the browser, paste your Gemini API key below.</p>
                        <form onSubmit={saveApiKey} className="space-y-4 mt-4">
                            <input
                                type="password"
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                                placeholder="AIzaSy..."
                                className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500"
                                required
                            />
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">Save & Continue</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto space-y-5 md:space-y-6 pb-12">
                    <div className="text-center relative pt-4 md:pt-0">
                        <button onClick={resetApiKey} className="absolute right-0 top-0 text-xs text-slate-400 hover:text-slate-600 underline">Reset API Key</button>
                        <h1 className="text-2xl md:text-3xl font-bold text-slate-800">Receipt Splitter</h1>
                        <p className="text-sm md:text-base text-slate-500 mt-2">Scan multiple receipts, assign items, and calculate the final split.</p>
                    </div>

                    <div className="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center">
                        <label className="block text-sm font-bold text-slate-700 mb-1 uppercase tracking-wider text-center">
                            {receipts.length > 0 ? '+ Add More Receipts' : 'Upload Receipt Images'}
                        </label>
                        <p className="text-xs text-slate-400 mb-3 md:mb-4 text-center">Select one or several images – each becomes its own receipt.</p>
                        <div className="relative w-full sm:w-auto">
                            <input
                                type="file"
                                accept="image/*"
                                multiple
                                onChange={handleFileUpload}
                                disabled={isLoading}
                                className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-colors cursor-pointer disabled:opacity-50"
                            />
                        </div>
                        {isLoading && (
                            <div className="mt-4 flex items-center text-blue-600 font-medium text-sm md:text-base">
                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Analysing with Gemini… {progress.done} of {progress.total} done
                            </div>
                        )}
                    </div>

                    {receipts.map((receipt) => {
                        const calculatedTotal = sumItems(receipt.items);
                        const mismatch = analyseMismatch(receipt);
                        const suspects = mismatch ? mismatch.suspects : {};
                        const suspectIds = Object.keys(suspects);

                        return (
                            <div key={receipt.id} className="bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
                                <div className="bg-slate-100 p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <h3 className="font-bold text-slate-800 text-lg uppercase tracking-wide break-all">
                                        {receipt.store} {receipt.date && receipt.date !== 'Unknown Date' ? `- ${receipt.date}` : ''}
                                    </h3>
                                    <div className="flex items-center space-x-2 md:space-x-3 bg-white px-2 md:px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm w-full sm:w-auto justify-between sm:justify-start">
                                        <div className="flex items-center">
                                            <span className="text-xs md:text-sm font-medium text-slate-600 mr-2">Paid by:</span>
                                            <div className="flex bg-slate-100 rounded p-1">
                                                <button onClick={() => updatePayer(receipt.id, 'Jason')} className={`px-2 md:px-3 py-1 text-xs font-bold rounded transition-colors ${receipt.payer === 'Jason' ? 'bg-blue-600 text-white shadow' : 'text-slate-500 hover:text-slate-700'}`}>Jason</button>
                                                <button onClick={() => updatePayer(receipt.id, 'Scott')} className={`px-2 md:px-3 py-1 text-xs font-bold rounded transition-colors ${receipt.payer === 'Scott' ? 'bg-emerald-600 text-white shadow' : 'text-slate-500 hover:text-slate-700'}`}>Scott</button>
                                            </div>
                                        </div>
                                        <button onClick={() => deleteReceipt(receipt.id)} className="text-red-400 hover:text-red-600 p-1" title="Delete Receipt">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                                        </button>
                                    </div>
                                </div>

                                <div className="hidden md:grid p-4 bg-slate-50 border-b border-slate-200 grid-cols-12 gap-4 font-semibold text-slate-700 text-sm">
                                    <div className="col-span-5">Item</div>
                                    <div className="col-span-3 text-right">Price</div>
                                    <div className="col-span-4 text-center">Assign To</div>
                                </div>

                                <div className="divide-y divide-slate-100">
                                    {receipt.items.length === 0 && (
                                        <div className="p-4 text-sm text-slate-400 text-center">No items on this receipt.</div>
                                    )}
                                    {receipt.items.map((item) => {
                                        const isDiscount = item.type === 'discount';
                                        const suspectReason = suspects[item.id];
                                        const rowBg = suspectReason
                                            ? 'bg-amber-50 hover:bg-amber-100'
                                            : isDiscount ? 'bg-rose-50/40 hover:bg-rose-50' : 'hover:bg-slate-50';

                                        return (
                                            <div key={item.id} className={`p-3 md:p-4 flex flex-col md:grid md:grid-cols-12 gap-2 md:gap-4 md:items-center transition-colors ${rowBg}`}>
                                                <div className="flex justify-between items-start w-full md:contents">
                                                    <div className={`md:col-span-5 text-sm font-medium break-words pr-3 md:pr-0 ${isDiscount ? 'text-rose-700 pl-4' : 'text-slate-800'}`}>
                                                        <div className="flex flex-wrap items-center gap-1.5">
                                                            {isDiscount && <span className="text-rose-400">↳</span>}
                                                            <span>{item.name}</span>
                                                            {item.edited && <span className="text-[10px] font-bold uppercase bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">Edited</span>}
                                                            {suspectReason && <span className="text-[10px] font-bold uppercase bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded">Check</span>}
                                                        </div>
                                                        {suspectReason && <div className="text-xs text-amber-700 mt-1 font-normal">{suspectReason}</div>}
                                                    </div>

                                                    <div className="md:col-span-3 flex items-center justify-end gap-1 whitespace-nowrap">
                                                        {isEditing(receipt.id, item.id) ? (
                                                            <EditInput isDiscount={isDiscount} />
                                                        ) : (
                                                            <>
                                                                <span className={`text-base md:text-sm font-mono font-bold ${isDiscount ? 'text-rose-600' : 'text-slate-600'}`}>
                                                                    {fmt(item.price)}
                                                                </span>
                                                                <button onClick={() => startEdit(receipt.id, item.id, item.price, isDiscount)} className="text-slate-400 hover:text-blue-600 p-1" title="Edit price">
                                                                    <PencilIcon />
                                                                </button>
                                                            </>
                                                        )}
                                                        <button onClick={() => deleteItem(receipt.id, item.id)} className="text-slate-400 hover:text-red-600 p-1" title="Delete line">
                                                            <XIcon />
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="md:col-span-4 flex justify-between w-full space-x-2 mt-1 md:mt-0">
                                                    <button onClick={() => setSelection(receipt.id, item.id, 'Jason')} className={`flex-1 px-2 py-2 md:py-1.5 text-xs md:text-sm font-medium rounded-md transition-colors ${item.selectedBy === 'Jason' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Jason</button>
                                                    <button onClick={() => setSelection(receipt.id, item.id, 'Both')} className={`flex-1 px-2 py-2 md:py-1.5 text-xs md:text-sm font-medium rounded-md transition-colors ${item.selectedBy === 'Both' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Both</button>
                                                    <button onClick={() => setSelection(receipt.id, item.id, 'Scott')} className={`flex-1 px-2 py-2 md:py-1.5 text-xs md:text-sm font-medium rounded-md transition-colors ${item.selectedBy === 'Scott' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Scott</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className={`p-4 text-sm font-medium border-t ${mismatch ? 'bg-red-50 text-red-700 border-red-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>
                                    <div className="flex flex-wrap justify-between items-center gap-2">
                                        <span>Calculated Total: {fmt(calculatedTotal)}</span>
                                        <span className="flex items-center gap-1">
                                            Receipt Total:&nbsp;
                                            {isEditing(receipt.id, null) ? (
                                                <EditInput isDiscount={false} />
                                            ) : (
                                                <>
                                                    <span>{fmt(receipt.receiptTotal)}</span>
                                                    <button onClick={() => startEdit(receipt.id, null, receipt.receiptTotal)} className="opacity-60 hover:opacity-100 p-1" title="Edit receipt total">
                                                        <PencilIcon />
                                                    </button>
                                                </>
                                            )}
                                        </span>
                                        {mismatch && <span className="text-xs font-bold uppercase bg-red-200 px-2 py-1 rounded">Mismatch</span>}
                                    </div>
                                    {mismatch && (
                                        <div className="mt-2 text-xs font-normal">
                                            Calculated is £{Math.abs(mismatch.diff).toFixed(2)} {mismatch.diff > 0 ? 'higher' : 'lower'} than the receipt.
                                            {suspectIds.length > 0
                                                ? ` Possible cause${suspectIds.length > 1 ? 's' : ''} highlighted above.`
                                                : ''}
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}

                    {receipts.length > 0 && (
                        <div className="mt-8 bg-slate-800 p-5 md:p-6 rounded-2xl shadow-xl border border-slate-700 space-y-6 text-white">
                            <h2 className="font-black text-xl md:text-2xl border-b border-slate-600 pb-3 uppercase tracking-wide text-slate-200 text-center md:text-left">Grand Settlement</h2>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                    <h3 className="text-blue-400 font-bold text-sm uppercase tracking-wider mb-2">Jason's Ledger</h3>
                                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-300">Target Share:</span> <span className="font-mono font-bold">£{jasonTotalShare.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-300">Actually Paid:</span> <span className="font-mono font-bold">£{jasonTotalPaid.toFixed(2)}</span></div>
                                </div>
                                <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                    <h3 className="text-emerald-400 font-bold text-sm uppercase tracking-wider mb-2">Scott's Ledger</h3>
                                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-300">Target Share:</span> <span className="font-mono font-bold">£{scottTotalShare.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-300">Actually Paid:</span> <span className="font-mono font-bold">£{scottTotalPaid.toFixed(2)}</span></div>
                                </div>
                            </div>

                            {hasUnassigned && (
                                <div className="bg-amber-900/40 border border-amber-700/50 text-amber-400 px-4 py-3 rounded-xl text-xs md:text-sm text-center font-medium">
                                    ⚠ Warning: {unassignedCount} line{unassignedCount > 1 ? 's' : ''} across your receipts {unassignedCount > 1 ? 'have' : 'has'} not been assigned yet.
                                </div>
                            )}

                            <div className="pt-4 border-t border-slate-600">
                                <div className="text-center font-black text-2xl md:text-3xl text-white bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">
                                    {settlementMessage}
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={shareReport} className="flex-1 flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" /><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" /></svg>
                                    Share / Email Report
                                </button>
                                <button onClick={copyReport} className="sm:w-40 flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 border border-slate-500 text-slate-100 font-bold py-3 rounded-xl transition-colors">
                                    {copied ? '✓ Copied' : 'Copy Report'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReceiptSplitter />);
    </script>
</body>
</html>
