<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-3 sm:p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        function ReceiptSplitter() {
            const [receipts, setReceipts] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(false);
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [isConfigured, setIsConfigured] = React.useState(!!localStorage.getItem('gemini_api_key'));

            const saveApiKey = (e) => {
                e.preventDefault();
                if (apiKey.trim()) {
                    localStorage.setItem('gemini_api_key', apiKey.trim());
                    setIsConfigured(true);
                }
            };

            const resetApiKey = () => {
                localStorage.removeItem('gemini_api_key');
                setApiKey('');
                setIsConfigured(false);
            };

            const compressImage = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 1600; 
                        let { width, height } = img;

                        if (width > height && width > MAX_DIM) {
                            height = Math.round(height * (MAX_DIM / width));
                            width = MAX_DIM;
                        } else if (height > width && height > MAX_DIM) {
                            width = Math.round(width * (MAX_DIM / height));
                            height = MAX_DIM;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                        resolve(compressedBase64);
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setIsLoading(true);

                try {
                    const base64Image = await compressImage(file);
                    
                    const prompt = `
                        Analyse this UK supermarket receipt.
                        Extract the store name, date, and purchased items into a strictly formatted JSON object.
                        
                        CRITICAL RULES FOR COSTCO RECEIPTS:
                        1. VOIDS: Completely ignore any line starting with "VOID" and also ignore the reversed discount line immediately below it.
                        2. IDENTIFYING DISCOUNTS: Any line where the final price ends in a minus sign (like "2.00-Z", "1.40-Z", or "-2.00") is a discount. 
                        3. APPLYING DISCOUNTS: You MUST subtract this discount amount from the product immediately above it. NEVER list the discount as its own separate item.
                        
                        EXAMPLES OF COMBINING:
                        - "MEXICANA 750G 6.99" followed by "MEXICANA SLICES 1.40-Z" -> Output ONE item: {"name": "MEXICANA 750G", "price": 5.59}
                        - "LMB/CK SAMOSA 960G 7.99 Z" followed by "CAFE ASIA SAMOSA 2.00-Z" -> Output ONE item: {"name": "LMB/CK SAMOSA 960G", "price": 5.59}
                        
                        4. Ensure prices reflect the final cost inclusive of VAT.
                        5. Ignore subtotals, tender amounts, change, or card details.
                        
                        Return ONLY a JSON object with this exact structure:
                        {
                            "store": "Name of the store (e.g., Costco) or 'Unknown Store'",
                            "date": "Date on receipt (e.g., DD/MM/YYYY) or 'Unknown Date'",
                            "items": [
                                {
                                    "name": "Clean item name",
                                    "price": final_calculated_net_price_as_number,
                                    "selectedBy": null
                                }
                            ]
                        }
                        
                        Do not include markdown blocks like \`\`\`json. Output ONLY the raw JSON object.
                    `;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: 'image/jpeg', data: base64Image } }
                                ]
                            }]
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error?.message || "Unknown API Error");
                    }
                    
                    let rawText = data.candidates[0].content.parts[0].text.trim();
                    if (rawText.startsWith("```json")) rawText = rawText.slice(7, -3);
                    else if (rawText.startsWith("```")) rawText = rawText.slice(3, -3);
                        
                    const parsedData = JSON.parse(rawText);
                    const parsedItems = parsedData.items.map((item, index) => ({
                        ...item,
                        id: `item-${Date.now()}-${index}`
                    }));

                    setReceipts([...receipts, {
                        id: `receipt-${Date.now()}`,
                        store: parsedData.store || `Receipt ${receipts.length + 1}`,
                        date: parsedData.date || '',
                        payer: 'Jason',
                        items: parsedItems
                    }]);
                    
                } catch (error) {
                    console.error("Full Error:", error);
                    alert(`Google API Error: ${error.message}`);
                } finally {
                    setIsLoading(false);
                    event.target.value = ''; 
                }
            };

            const setSelection = (receiptId, itemId, person) => {
                setReceipts(receipts.map(receipt => {
                    if (receipt.id !== receiptId) return receipt;
                    return {
                        ...receipt,
                        items: receipt.items.map(item => 
                            item.id === itemId ? { ...item, selectedBy: person } : item
                        )
                    };
                }));
            };

            const updatePayer = (receiptId, person) => {
                setReceipts(receipts.map(receipt => 
                    receipt.id === receiptId ? { ...receipt, payer: person } : receipt
                ));
            };

            const deleteReceipt = (receiptId) => {
                if(confirm("Remove this receipt?")) {
                    setReceipts(receipts.filter(r => r.id !== receiptId));
                }
            };

            let jasonTotalShare = 0;
            let scottTotalShare = 0;
            let jasonTotalPaid = 0;
            let scottTotalPaid = 0;
            let grandTotal = 0;
            let assignedTotal = 0;

            receipts.forEach(receipt => {
                let receiptTotal = 0;
                receipt.items.forEach(item => {
                    receiptTotal += item.price;
                    grandTotal += item.price;
                    
                    if (item.selectedBy === 'Jason') { jasonTotalShare += item.price; assignedTotal += item.price; }
                    else if (item.selectedBy === 'Scott') { scottTotalShare += item.price; assignedTotal += item.price; }
                    else if (item.selectedBy === 'Both') { 
                        jasonTotalShare += item.price / 2; 
                        scottTotalShare += item.price / 2; 
                        assignedTotal += item.price; 
                    }
                });
                
                if (receipt.payer === 'Jason') jasonTotalPaid += receiptTotal;
                if (receipt.payer === 'Scott') scottTotalPaid += receiptTotal;
            });

            const hasUnassigned = assignedTotal > 0 && assignedTotal < (grandTotal - 0.05);
            const jasonBalance = jasonTotalPaid - jasonTotalShare;
            const scottBalance = scottTotalPaid - scottTotalShare;
            
            let settlementMessage = "Totals are perfectly balanced.";
            if (jasonBalance > 0.01) {
                settlementMessage = `Scott owes Jason £${jasonBalance.toFixed(2)}`;
            } else if (scottBalance > 0.01) {
                settlementMessage = `Jason owes Scott £${scottBalance.toFixed(2)}`;
            } else if (assignedTotal === 0 && receipts.length > 0) {
                settlementMessage = "Assign items to calculate settlement.";
            } else if (receipts.length === 0) {
                settlementMessage = "No receipts scanned yet.";
            }

            if (!isConfigured) {
                return (
                    <div className="max-w-md mx-auto mt-10 md:mt-20 bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-4">
                        <h1 className="text-2xl font-bold text-slate-800">Setup Required</h1>
                        <p className="text-slate-600 text-sm">To run this app in the browser, paste your Gemini API key below.</p>
                        <form onSubmit={saveApiKey} className="space-y-4 mt-4">
                            <input 
                                type="password" 
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                                placeholder="AIzaSy..."
                                className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500"
                                required
                            />
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">Save & Continue</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto space-y-5 md:space-y-6 pb-12">
                    <div className="text-center relative pt-4 md:pt-0">
                        <button onClick={resetApiKey} className="absolute right-0 top-0 text-xs text-slate-400 hover:text-slate-600 underline">Reset API Key</button>
                        <h1 className="text-2xl md:text-3xl font-bold text-slate-800">Receipt Splitter</h1>
                        <p className="text-sm md:text-base text-slate-500 mt-2">Scan multiple receipts, assign items, and calculate the final split.</p>
                    </div>

                    <div className="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center">
                        <label className="block text-sm font-bold text-slate-700 mb-3 md:mb-4 uppercase tracking-wider text-center">
                            {receipts.length > 0 ? "+ Add Another Receipt" : "Upload Receipt Image"}
                        </label>
                        <div className="relative w-full sm:w-auto">
                            <input 
                                type="file" 
                                accept="image/*" 
                                onChange={handleFileUpload}
                                disabled={isLoading}
                                className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-colors cursor-pointer disabled:opacity-50"
                            />
                        </div>
                        {isLoading && (
                            <div className="mt-4 flex items-center text-blue-600 font-medium text-sm md:text-base">
                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Analysing with Gemini...
                            </div>
                        )}
                    </div>

                    {receipts.map((receipt) => (
                        <div key={receipt.id} className="bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
                            <div className="bg-slate-100 p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <h3 className="font-bold text-slate-800 text-lg uppercase tracking-wide">
                                    {receipt.store} {receipt.date && receipt.date !== 'Unknown Date' ? `- ${receipt.date}` : ''}
                                </h3>
                                <div className="flex items-center space-x-2 md:space-x-3 bg-white px-2 md:px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm w-full sm:w-auto justify-between sm:justify-start">
                                    <div className="flex items-center">
                                        <span className="text-xs md:text-sm font-medium text-slate-600 mr-2">Paid by:</span>
                                        <div className="flex bg-slate-100 rounded p-1">
                                            <button onClick={() => updatePayer(receipt.id, 'Jason')} className={`px-2 md:px-3 py-1 text-xs font-bold rounded transition-colors ${receipt.payer === 'Jason' ? 'bg-blue-600 text-white shadow' : 'text-slate-500 hover:text-slate-700'}`}>Jason</button>
                                            <button onClick={() => updatePayer(receipt.id, 'Scott')} className={`px-2 md:px-3 py-1 text-xs font-bold rounded transition-colors ${receipt.payer === 'Scott' ? 'bg-emerald-600 text-white shadow' : 'text-slate-500 hover:text-slate-700'}`}>Scott</button>
                                        </div>
                                    </div>
                                    <button onClick={() => deleteReceipt(receipt.id)} className="text-red-400 hover:text-red-600 p-1" title="Delete Receipt">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                                    </button>
                                </div>
                            </div>
                            
                            <div className="hidden md:grid p-4 bg-slate-50 border-b border-slate-200 grid-cols-12 gap-4 font-semibold text-slate-700 text-sm">
                                <div className="col-span-5">Item</div>
                                <div className="col-span-2 text-right">Price</div>
                                <div className="col-span-5 text-center">Assign To</div>
                            </div>

                            <div className="divide-y divide-slate-100">
                                {receipt.items.map((item) => (
                                    <div key={item.id} className="p-4 flex flex-col md:grid md:grid-cols-12 gap-3 md:gap-4 md:items-center hover:bg-slate-50 transition-colors">
                                        
                                        <div className="flex justify-between items-start w-full md:contents">
                                            <div className="md:col-span-5 text-sm md:text-sm font-medium text-slate-800 break-words pr-4 md:pr-0">
                                                {item.name}
                                            </div>
                                            <div className="md:col-span-2 text-base md:text-sm text-right font-mono font-bold text-slate-600 whitespace-nowrap">
                                                £{item.price.toFixed(2)}
                                            </div>
                                        </div>

                                        <div className="md:col-span-5 flex justify-between w-full space-x-2 mt-1 md:mt-0">
                                            <button onClick={() => setSelection(receipt.id, item.id, 'Jason')} className={`flex-1 md:flex-none px-2 py-2 md:py-1.5 md:px-3 text-xs md:text-sm font-medium rounded-md transition-colors ${item.selectedBy === 'Jason' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Jason</button>
                                            <button onClick={() => setSelection(receipt.id, item.id, 'Both')} className={`flex-1 md:flex-none px-2 py-2 md:py-1.5 md:px-3 text-xs md:text-sm font-medium rounded-md transition-colors ${item.selectedBy === 'Both' ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Both</button>
                                            <button onClick={() => setSelection(receipt.id, item.id, 'Scott')} className={`flex-1 md:flex-none px-2 py-2 md:py-1.5 md:px-3 text-xs md:text-sm font-medium rounded-md transition-colors ${item.selectedBy === 'Scott' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Scott</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}

                    {receipts.length > 0 && (
                        <div className="mt-8 bg-slate-800 p-5 md:p-6 rounded-2xl shadow-xl border border-slate-700 space-y-6 text-white">
                            <h2 className="font-black text-xl md:text-2xl border-b border-slate-600 pb-3 uppercase tracking-wide text-slate-200 text-center md:text-left">Grand Settlement</h2>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                    <h3 className="text-blue-400 font-bold text-sm uppercase tracking-wider mb-2">Jason's Ledger</h3>
                                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-300">Target Share:</span> <span className="font-mono font-bold">£{jasonTotalShare.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-300">Actually Paid:</span> <span className="font-mono font-bold">£{jasonTotalPaid.toFixed(2)}</span></div>
                                </div>
                                <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                    <h3 className="text-emerald-400 font-bold text-sm uppercase tracking-wider mb-2">Scott's Ledger</h3>
                                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-300">Target Share:</span> <span className="font-mono font-bold">£{scottTotalShare.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-300">Actually Paid:</span> <span className="font-mono font-bold">£{scottTotalPaid.toFixed(2)}</span></div>
                                </div>
                            </div>

                            {hasUnassigned && (
                                <div className="bg-amber-900/40 border border-amber-700/50 text-amber-400 px-4 py-3 rounded-xl text-xs md:text-sm text-center font-medium">
                                    ⚠ Warning: Some items across your receipts have not been assigned yet.
                                </div>
                            )}

                            <div className="pt-4 border-t border-slate-600">
                                <div className="text-center font-black text-2xl md:text-3xl text-white bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">
                                    {settlementMessage}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReceiptSplitter/>);
    </script>
</body>
</html>
